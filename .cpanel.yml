---
deployment:
  tasks:
    - export DEPLOYPATH=/home/logimoto/public_html/
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R css $DEPLOYPATH
    - /bin/cp -R data $DEPLOYPATH
    - /bin/cp -R js $DEPLOYPATH
    - /bin/cp -R locales $DEPLOYPATH
    - /bin/cp -R tools $DEPLOYPATH
    - /bin/cp index.html $DEPLOYPATH
