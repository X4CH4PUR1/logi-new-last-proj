    <!-- Update this if the site moves to its own domain. -->

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LOGIMOTORS" />

    />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!--
      Preload the two Latin cuts: they are needed for the first paint whatever
      the language, because the header and the logo are Latin in all three.
      The Georgian, Cyrillic and symbol subsets are left to font-display: swap
      and are fetched only if the page actually contains those characters.
    -->
    <link
      rel="preload"
      href="assets/fonts/exo2-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/unbounded-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      Stylesheets are listed in cascade order, narrowest scope last:
      tokens -> base -> animations -> layout -> components -> pages -> admin.
      No build step and no @import, so each is a normal parallel request.
    -->
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/admin.css" />

    <!--
      Applies the saved theme before the first paint. Without this, someone who
      chose the light theme gets a dark flash on every page load. It is inline
      and tiny on purpose: an external file would arrive too late to help.
    -->
    <script>
      try {
        var saved = localStorage.getItem('logi:theme');
        if (saved === 'night' || saved === 'day') {
          document.documentElement.dataset.theme = saved;
        }
      } catch (e) {
        /* private mode: the default night theme applies */
      }
    </script>

    <!--
      Loaded as classic (non-module) scripts, in dependency order, so the site
      also runs from file:// (double-clicking index.html) with no local server.
      Browsers refuse to execute <script type="module"> across the file://
      origin at all, which is what used to leave the page on a black screen
      with nothing but the favicon. Each file below assigns itself onto a
      window.Logi.* namespace instead of using import/export; see any file
      under js/ for the pattern. defer keeps them running in this order, after
      the DOM is parsed, same as modules would.
    -->
    <script defer src="js/core/dom.js"></script>
    <script defer src="js/data/config.js"></script>
    <script defer src="js/core/router.js"></script>
    <script defer src="locales/ka.js"></script>
    <script defer src="locales/en.js"></script>
    <script defer src="locales/ru.js"></script>
    <script defer src="js/util/storage.js"></script>

    <script defer src="js/util/format.js"></script>

    <script defer src="js/core/selectors.js"></script>
    <script defer src="js/core/theme.js"></script>
    <script defer src="js/views/social.js"></script>
