<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LOGIMOTORS">
  <title>LOGIMOTORS</title>
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5a800"/>
      <stop offset="1" stop-color="#f07818"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="10" fill="#101218"/>

  <text x="32" y="39" text-anchor="middle"
        font-family="Unbounded, 'Arial Black', sans-serif" font-weight="900" font-size="32"
        fill="url(#warm)">L</text>

  <!-- hazard bar: solid gradient with notches punched out in the background colour -->
  <rect x="13" y="45" width="38" height="7" fill="url(#warm)"/>
  <g fill="#101218">
    <rect x="17" y="45" width="4" height="7"/>
    <rect x="26" y="45" width="4" height="7"/>
    <rect x="35" y="45" width="4" height="7"/>
    <rect x="44" y="45" width="4" height="7"/>
  </g>
</svg>
