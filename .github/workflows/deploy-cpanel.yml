name: Deploy to cPanel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          mkdir -p dist
          cp -r assets css data js locales tools index.html dist/

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.CPANEL_SFTP_USER }}
          server: ${{ secrets.CPANEL_SFTP_HOST }}
          port: ${{ secrets.CPANEL_SFTP_PORT }}
          ssh_private_key: ${{ secrets.CPANEL_SFTP_KEY }}
          local_path: './dist/*'
          remote_path: ${{ secrets.CPANEL_SFTP_REMOTE_PATH }}
          sftp_only: true
